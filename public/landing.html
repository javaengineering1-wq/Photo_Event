<!doctype html>

  <title>Photo Contest</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>Photo Contest</h1>
    </div>

    <div class="card stack">

  </div>
